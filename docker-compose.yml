version: '3.9'

services:
  db:
    image: mysql:8.4
    container_name: alexandria-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: alexandria
      MYSQL_USER: alexandria
      MYSQL_PASSWORD: changeme
    ports:
      - "3306:3306"
    volumes:
      - alexandria-data:/var/lib/mysql
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - alexandria-net

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    container_name: alexandria-keycloak
    command: [ "start-dev", "--import-realm" ]
    restart: unless-stopped
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080"
    volumes:
      - ./docker/keycloak/realm-alexandria.json:/opt/keycloak/data/import/realm-alexandria.json:ro
    networks:
      - alexandria-net

  keycloak-init:
    image: alpine:3.20
    container_name: alexandria-keycloak-init
    depends_on:
      keycloak:
        condition: service_started
    environment:
      KC_BASE_URL: "http://keycloak:8080"
      KC_ADMIN_USER: "admin"
      KC_ADMIN_PASSWORD: "admin"
      REALM: "alexandria"
    volumes:
      - ./docker/keycloak/init-users.sh:/init-users.sh:ro
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache curl jq >/dev/null && /bin/sh /init-users.sh"]
    networks:
      - alexandria-net

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: alexandria-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_started
      keycloak-init:
        condition: service_completed_successfully
    environment:
      ALEXANDRIA_DB_URL: "jdbc:mysql://db:3306/alexandria?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true"
      ALEXANDRIA_DB_USERNAME: alexandria
      ALEXANDRIA_DB_PASSWORD: changeme
      ALEXANDRIA_DB_POOL_SIZE: 5
      ALEXANDRIA_DB_MINIMUM_IDLE: 1
      ALEXANDRIA_OIDC_ISSUER_CLAIM: "http://localhost:8081/realms/alexandria"
      ALEXANDRIA_OIDC_JWKS_URL: "http://keycloak:8080/realms/alexandria/protocol/openid-connect/certs"
      ALEXANDRIA_OIDC_CLIENT_ID: "alexandria-swagger"
      ALEXANDRIA_OIDC_CLIENT_SECRET: "change-me"
    ports:
      - "8080:8080"
    networks:
      - alexandria-net

volumes:
  alexandria-data:
    driver: local

networks:
  alexandria-net:
    driver: bridge
