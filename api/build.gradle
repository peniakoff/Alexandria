plugins {
    id 'io.micronaut.application' version '4.4.4'
}

description = 'Alexandria API (Micronaut).'

dependencies {
    implementation project(':core')

    implementation "com.mysql:mysql-connector-j:${rootProject.ext.mysqlVersion}"
    implementation "org.xerial:sqlite-jdbc:${rootProject.ext.sqliteVersion}"
    implementation "com.zaxxer:HikariCP:${rootProject.ext.hikaricpVersion}"
    implementation "org.slf4j:slf4j-api:${rootProject.ext.slf4jVersion}"
    implementation "ch.qos.logback:logback-classic:${rootProject.ext.logbackVersion}"
    implementation "com.google.code.gson:gson:${rootProject.ext.gsonVersion}"

    implementation "io.micronaut:micronaut-http-server-netty"
    implementation "io.micronaut:micronaut-jackson-databind"
    implementation "io.micronaut:micronaut-runtime"
    implementation "io.micronaut:micronaut-http-client"
    runtimeOnly "org.yaml:snakeyaml"

    testImplementation "io.micronaut:micronaut-http-client"
    testImplementation "io.micronaut.test:micronaut-test-junit5"
    testImplementation "com.h2database:h2:${rootProject.ext.h2Version}"
    testImplementation "org.junit.jupiter:junit-jupiter:${rootProject.ext.junitVersion}"
    testRuntimeOnly    "org.junit.platform:junit-platform-launcher:${rootProject.ext.junitPlatformVersion}"

    implementation "io.micronaut.security:micronaut-security-oauth2"
    implementation "io.micronaut.security:micronaut-security-jwt"

    annotationProcessor "io.micronaut.openapi:micronaut-openapi"
    compileOnly "io.micronaut.openapi:micronaut-openapi-annotations"
}

application {
    mainClass = 'pl.tomaszmiller.api.Application'
}

micronaut {
    version("4.10.10")
    runtime("netty")
    testRuntime("junit5")
    processing {
        incremental(true)
        annotations("pl.tomaszmiller.*")
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.addAll([
            "-Amicronaut.openapi.views.spec=swagger-ui.enabled=true,swagger-ui.theme=flattop,swagger-ui.deepLinking=true,swagger-ui.displayRequestDuration=true,swagger-ui.operationsSorter=method"
    ])
}
